services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: idsips-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - USE_POSTGRES=true
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=ids_ips_user
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-ids_ips_password}
      - POSTGRES_DB=ids_ips_db
      - DATABASE_URL=postgresql://ids_ips_user:ids_ips_password@postgres:5432/ids_ips_db
      - SECRET_KEY=${SECRET_KEY:-change_me_32_chars_min_1234567890}
      - CORS_ENVIRONMENT=${CORS_ENVIRONMENT:-prod}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-["http://localhost:3000"]}
      - CORS_ALLOW_CREDENTIALS=${CORS_ALLOW_CREDENTIALS:-true}
      - SMTP_SERVER=${SMTP_SERVER:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_SENDER_EMAIL=${SMTP_SENDER_EMAIL:-}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
      # Plan MCP : sans MCP_API_KEY, l'application refuse de démarrer (fail-fast).
      - MCP_API_KEY=${MCP_API_KEY:?MCP_API_KEY est obligatoire (voir .env)}
      - MCP_SERVER_NAME=${MCP_SERVER_NAME:-ids_ips_mcp}
      - MCP_PUBLIC_HOSTNAME=${MCP_PUBLIC_HOSTNAME:-localhost}
      - MCP_ALLOWED_HOSTS=${MCP_ALLOWED_HOSTS:-}
      - MCP_ALLOWED_ORIGINS=${MCP_ALLOWED_ORIGINS:-}
      - MCP_RATE_LIMIT_ENABLED=${MCP_RATE_LIMIT_ENABLED:-true}
      - MCP_RATE_LIMIT_REQUESTS=${MCP_RATE_LIMIT_REQUESTS:-60}
      - MCP_RATE_LIMIT_WINDOW_SECONDS=${MCP_RATE_LIMIT_WINDOW_SECONDS:-60}
      - MCP_RATE_LIMIT_MAX_BUCKETS=${MCP_RATE_LIMIT_MAX_BUCKETS:-4096}
      - MCP_RATE_LIMIT_MAX_SSE_CONNECTIONS=${MCP_RATE_LIMIT_MAX_SSE_CONNECTIONS:-4}
      - MCP_MTLS_ENABLED=${MCP_MTLS_ENABLED:-false}
      - MCP_MTLS_PROXY_SECRET=${MCP_MTLS_PROXY_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - idsips-net

  postgres:
    image: postgres:16-alpine
    container_name: idsips-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=ids_ips_user
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-ids_ips_password}
      - POSTGRES_DB=ids_ips_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ids_ips_user -d ids_ips_db"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - idsips-net

  redis:
    image: redis:7-alpine
    container_name: idsips-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - idsips-net

volumes:
  postgres_data:
  redis_data:

networks:
  idsips-net:
    driver: bridge
