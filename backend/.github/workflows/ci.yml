name: CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Ruff check
        run: ruff check app/ tests/

      - name: Ruff format check
        run: ruff format --check app/ tests/

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD

  tests:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ids_ips_user
          POSTGRES_PASSWORD: ids_ips_password
          POSTGRES_DB: ids_ips_db
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run migrations (sqlite fallback if needed)
        env:
          DATABASE_URL: sqlite:///./ids_ips_local.db
        run: |
          python - <<'PY'
          from app.core.config import settings
          from alembic.config import Config
          from alembic import command
          alembic_cfg = Config("alembic.ini")
          alembic_cfg.set_main_option("sqlalchemy.url", settings.DATABASE_URL)
          command.upgrade(alembic_cfg, "head")
          print("Alembic upgrade OK")
          PY

      - name: Pytest
        env:
          DATABASE_URL: sqlite:///./ids_ips_local.db
          SECRET_KEY: test_secret_key_32_chars_minimum_1234567890
        run: pytest tests/ -v

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [lint, secret-scan, tests]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: idsips-api:ci-${{ github.sha }}
