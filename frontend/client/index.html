<!doctype html>
<html lang="fr" class="theme-5">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1"
    />
    <title>Snort Network Monitoring Application</title>
    <link rel="icon" type="image/webp" href="/Seeyou.webp" />
    <link rel="apple-touch-icon" href="/Seeyou.webp" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <!-- Anti-flash : applique le thème de couleurs et le mode avant le premier rendu. -->
    <script>
      (function () {
        try {
          var validThemes = [
            "theme-1",
            "theme-2",
            "theme-3",
            "theme-4",
            "theme-5",
          ];
          var storedColor = localStorage.getItem("color-theme");
          var colorTheme =
            validThemes.indexOf(storedColor) !== -1 ? storedColor : "theme-5";
          var root = document.documentElement;

          validThemes.forEach(function (name) {
            root.classList.remove(name);
          });
          root.classList.add(colorTheme);

          var stored = localStorage.getItem("theme");
          var dark =
            stored === "dark" ||
            (stored !== "light" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          root.classList.toggle("dark", dark);
        } catch (e) {
          /* Stockage indisponible : le HTML garde theme-5 et le mode clair. */
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!--<script
      defer
      src="%X_VITE_ANALYTICS_ENDPOINT%/umami"
      data-website-id="%X_VITE_ANALYTICS_WEBSITE_ID%"></script>-->
  </body>
</html>
